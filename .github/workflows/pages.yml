name: Deploy shop
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: shop
      - id: d
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.d.outcome == 'failure'
        run: sleep 45
      - id: d2
        if: steps.d.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.d.outcome == 'failure' && steps.d2.outcome == 'failure'
        run: sleep 90
      - if: steps.d.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4
