<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>nnz ວິຕາມິນ</title>
<meta name="description" content="ວິຕາມິນ ແລະ ອາຫານເສີມນຳເຂົ້າຈາກ ນິວຊີແລນ ແລະ ອົດສະຕາລີ · ສັ່ງງ່າຍທາງ WhatsApp">
<meta name="theme-color" content="#e52535">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="images/icon-192.png">
<link rel="apple-touch-icon" href="images/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="nnz ວິຕາມິນ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700;800&family=Inter:wght@500;600;700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}

/* Layout: phone-first shop — red brand band on top, scrolling shelf, fixed bottom tab bar */
:root{
  --brand:#e52535; --brand-ink:#ffffff; --leaf:#8cc63f; --leaf-deep:#3f7d1c;
  --bg:#f6f3f1; --surface:#ffffff; --fg:#1f1a1a; --muted:#6e6464; --line:#e7e0dd;
  --chip:#fbe9ea; --chip-ink:#a3121f; --warn-bg:#fff4d6; --warn-ink:#7a5600;
  --price:#c41626; --shadow:0 1px 2px rgba(60,20,20,.06),0 4px 14px rgba(60,20,20,.06);
  --f-text:"Noto Sans Lao","Inter",system-ui,sans-serif;
  --f-num:"Inter","Noto Sans Lao",system-ui,sans-serif;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161212; --surface:#221c1c; --fg:#f3eeec; --muted:#b3a7a5; --line:#3a3030;
  --chip:#3d1c1f; --chip-ink:#ffb3b8; --warn-bg:#3a2f12; --warn-ink:#ffd98a; --price:#ff6b76;
  --leaf-deep:#a6dc6a; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161212; --surface:#221c1c; --fg:#f3eeec; --muted:#b3a7a5; --line:#3a3030;
  --chip:#3d1c1f; --chip-ink:#ffb3b8; --warn-bg:#3a2f12; --warn-ink:#ffd98a; --price:#ff6b76;
  --leaf-deep:#a6dc6a; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-text);font-size:15px;line-height:1.5;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* prototype ribbon */
.proto{background:var(--warn-bg);color:var(--warn-ink);font-size:12.5px}
.proto .wrap{padding-block:6px;display:flex;gap:8px;align-items:center}
.proto b{font-weight:700}

/* top band */
.top{background:var(--brand);color:var(--brand-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top .wrap{padding-block:10px;display:flex;align-items:center;gap:10px}
.top img{height:40px;width:auto;border-radius:6px}
.top .grow{flex:1;min-width:0}
.top .name{font-weight:800;font-size:15px;line-height:1.2}
.top .sub{font-size:12px;opacity:.9}
.iconbtn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
.iconbtn svg{width:16px;height:16px}
.searchbar{padding-block:0 12px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);color:var(--fg);border-radius:12px;padding:0 12px;height:44px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;outline:0;background:transparent;font:inherit;color:inherit;flex:1;min-width:0;height:100%}
.search{flex:1;min-width:0}
.bbtn{flex:none;height:44px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border:0;border-radius:12px;background:rgba(255,255,255,.18);color:#fff;font:700 14px/1 var(--f-text);cursor:pointer}
.bbtn svg{width:17px;height:17px}
.bbtn[aria-expanded="true"]{background:#fff;color:var(--brand)}
.bdrop{position:absolute;left:0;right:0;top:100%;background:var(--surface);color:var(--fg);box-shadow:0 12px 28px rgba(0,0,0,.18);max-height:min(72vh,560px);overflow-y:auto;border-radius:0 0 16px 16px}
.bdrop .bd-in{max-width:560px;margin:0 auto;padding:10px 16px 16px}
.bd-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px;position:sticky;top:0;background:var(--surface);z-index:1}
.bd-tabs button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:600 13px/1 var(--f-text);cursor:pointer}
.bd-tabs button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.bd-letter{font:800 13px/1 "Inter",system-ui,sans-serif;color:var(--brand);margin:12px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.bd-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--fg);padding:8px 2px;text-align:left;cursor:pointer;border-radius:8px}
.bd-item:active{background:var(--chip)}
.bd-item .bmark{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 9.5px/1 "Inter",system-ui,sans-serif;flex:none}
.bd-item b{flex:1;font:600 14px/1.2 "Inter",system-ui,sans-serif}
.bd-item .num{color:var(--muted);font-size:12px}
.bd-item[aria-pressed="true"] b{color:var(--brand)}

/* sections */
main .wrap{display:flex;flex-direction:column;gap:22px;padding-block:16px}
h2{font-size:17px;font-weight:800;margin:0;text-wrap:balance}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.sechead .more{font-size:13px;color:var(--brand);font-weight:600;background:none;border:0;padding:0}
:root[data-theme="dark"] .sechead .more{color:var(--price)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sechead .more{color:var(--price)}}

/* how to order strip */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--surface);border-radius:14px;padding:12px 8px;box-shadow:var(--shadow)}
.step{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-size:12px;line-height:1.3;color:var(--muted)}
.step i{font-style:normal;font-family:var(--f-num);font-weight:800;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--chip-ink);font-size:13px}
.psteps{background:#fff6f6;border:1px solid #f6d3d5;border-radius:12px;padding:10px 12px;margin-top:2px}
.psteps .ph{display:block;font-size:14px;margin-bottom:6px;color:var(--brand)}
.psteps ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.psteps li{display:flex;gap:8px;align-items:center;font-size:13.5px;line-height:1.35;color:var(--fg)}
.psteps li b{color:var(--brand)}
.psteps i{flex:none;font-style:normal;font-family:var(--f-num);font-weight:800;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff;font-size:12px;margin-top:1px}
.psteps .phelp{margin:8px 0 0;padding-top:7px;border-top:1px dashed #f0c4c7;font-size:12.5px;color:var(--muted)}

/* needs grid */
.promorow{display:flex;gap:8px}.promorow .inp{flex:1;text-transform:uppercase}.promorow .cta{flex:none;padding:0 14px}.promook{color:var(--leaf-deep)!important;font-weight:600}.promobad{color:var(--price)!important}
.maplink{margin-top:8px;width:100%;text-decoration:none}.mapbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--fg);text-decoration:none;margin:6px 0 12px}.mapbar>span:first-child{font-size:24px}.mapbar>span:nth-child(2){flex:1;display:flex;flex-direction:column;gap:2px}.mapbar small{color:var(--muted);font-size:12px}.mapbar .go{color:var(--brand);font-weight:700;font-size:14px;white-space:nowrap}
.brands{display:flex;flex-wrap:wrap;gap:8px}
.bchip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;line-height:1}
.bchip .num{color:var(--muted);font-weight:400;font-size:12px;margin-left:2px}
.bchip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.bchip[aria-pressed="true"] .num{color:var(--brand-ink)}
.brandbox summary{font-weight:700;font-size:15px;padding:6px 0;cursor:pointer}
.brandbox .brands{margin-top:8px}
.bgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.brow{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;margin-inline:-4px;padding:2px 4px 6px;scrollbar-width:none}
.brow::-webkit-scrollbar{display:none}
.brow .btile{flex:0 0 78px;scroll-snap-align:start}
.btile{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:8px 4px 7px;cursor:pointer;min-width:0}
.btile .bmark{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 11px/1 "Inter",system-ui,sans-serif;letter-spacing:.3px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.btile .bname{font:700 11.5px/1.2 "Inter",system-ui,sans-serif;text-align:center;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.4em}
.btile .bnum{font-size:10px;color:var(--muted);line-height:1}
.brow .btile .bnum{display:none}
.btile[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.btile[aria-pressed="true"] .bname{color:var(--brand)}
.bgroup{font-size:13px;margin:10px 0 6px;color:var(--fg);font-weight:700}.bgroup .num{color:var(--muted);font-weight:400;font-size:12px}
.needs{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:minmax(132px,40%);gap:8px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;margin-inline:-4px;padding:2px 4px 4px;scrollbar-width:none}
.needs::-webkit-scrollbar{display:none}
.need{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--cb),var(--cb2));border:1px solid var(--cb);border-radius:14px;padding:8px 10px 8px 8px;font:700 12.5px/1.25 var(--f-text);color:var(--fg);text-align:left;cursor:pointer;scroll-snap-align:start;min-height:52px}
.need .dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--c);flex:none;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.need .dot svg{width:20px;height:20px;color:#fff;flex:none}
.need[aria-pressed="true"]{background:var(--c);color:#fff}
.need[aria-pressed="true"] .dot{background:#fff}
.need[aria-pressed="true"] .dot svg{color:var(--c)}
.ccards{display:grid;grid-auto-flow:column;grid-auto-columns:44%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;margin-inline:-4px;padding:2px 4px 6px;scrollbar-width:none}
.ccards::-webkit-scrollbar{display:none}
.cdots{display:flex;justify-content:center;gap:6px;margin-top:6px}
.cdots i{width:7px;height:7px;border-radius:50%;background:#d9cfd0;transition:all .2s}
.cdots i.on{width:18px;border-radius:4px;background:var(--brand)}
.ccard{display:flex;flex-direction:column;border:0;padding:0 !important;border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;scroll-snap-align:start;text-align:left}
.ccard img{display:block;width:100%;aspect-ratio:600/430;object-fit:cover}
.ccard .clab{position:relative;display:flex;align-items:center;min-height:40px;padding:6px 10px 6px 22px;background:var(--brand);color:#fff;font:800 13px/1.2 var(--f-text)}
.ccard .clab::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:var(--leaf);clip-path:polygon(0 0,55% 0,100% 50%,55% 100%,0 100%)}
.ccard[aria-pressed="true"]{outline:3px solid var(--brand);outline-offset:-3px}
.ncards{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;margin-inline:-4px;padding:2px 4px 6px;scrollbar-width:none}
.ncards::-webkit-scrollbar{display:none}
.ncard{flex:0 0 100px;display:flex;flex-direction:column;border:0;padding:0;border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;scroll-snap-align:start;text-align:left}
.ncard .nimg{display:block;height:84px;background:#f3efe9;overflow:hidden}
.ncard .nph{display:grid;place-items:center;height:100%;color:var(--c)}.ncard .nph svg{width:36px;height:36px}
.ncard .nlab{position:relative;display:flex;align-items:center;min-height:32px;padding:4px 6px 4px 13px;background:var(--c);color:#fff;font:700 12px/1.2 var(--f-text)}
.ncard .nlab::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--leaf);clip-path:polygon(0 0,60% 0,100% 50%,60% 100%,0 100%)}
.ncard[aria-pressed="true"]{outline:3px solid var(--c);outline-offset:-3px}

/* product rows / grid */
.row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,46%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;margin-inline:-4px;padding-inline:4px}
.row>*{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:block;width:100%;height:auto;align-self:start;border:1px solid var(--line);text-align:left;padding:0;margin:0;font:inherit;color:inherit;-webkit-appearance:none;appearance:none;cursor:pointer}
.card .pic{position:relative;display:block;width:100%;height:0;padding-top:100%;overflow:hidden;background:linear-gradient(160deg,var(--chip),var(--bg))}
.card .pic>img,.card .pic>svg{position:absolute;inset:0;width:100%;height:100%}
.card .pic svg{width:100%;height:100%;display:block}
.tag{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--leaf);color:#173000}
.tag.out{background:#5b5252;color:#fff}
.tag.pre{background:#0b7a75;color:#fff}.stock.pre{color:#0b7a75}.stock.pre::before{background:#0b7a75}.prenote{display:block;color:#0b7a75;font-size:12.5px;font-weight:600}
.card .pic .rank{position:absolute;left:8px;right:auto;top:auto;bottom:8px;height:auto;width:auto;line-height:1.4;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#fff4d6;color:#a3121f;box-shadow:0 1px 3px rgba(0,0,0,.15);z-index:1}
.card .pic .rank.top{background:#ffd400;color:#7a0710}
.rankline{display:inline-block;margin-bottom:4px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#ffd400;color:#7a0710}
.tag.promo{background:#ffd400;color:#7a0710}
.tag.trial{left:auto;right:8px;background:var(--brand);color:#fff}
.card .body{padding:10px 10px 12px;display:flex;flex-direction:column;gap:4px;min-height:118px}
.card .nm{font-weight:700;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.card .meta{font-size:12px;color:var(--muted)}
.card .pr{margin-top:auto;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.card .pr b{font-family:var(--f-num);font-weight:800;color:var(--price);font-size:16px}
.card .pr s{font-family:var(--f-num);color:var(--muted);font-size:12px}
.card .pr small{font-size:11.5px;color:var(--leaf-deep);font-weight:600}

/* sheets */
.sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(20,10,10,.45)}
.panel{background:var(--bg);border-radius:20px 20px 0 0;max-height:92%;overflow-y:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.panel .wrap{display:flex;flex-direction:column;gap:14px;padding-block:14px}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
.close{align-self:flex-end;border:0;background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.hero{border-radius:16px;overflow:hidden;width:100%;height:0;padding-top:100%;background:linear-gradient(160deg,var(--chip),var(--surface));position:relative}
.hero>img,.hero>svg{position:absolute;inset:0;width:100%;height:100%}
.hero>img{object-fit:contain!important;background:#fff}
.hero svg{width:100%;height:100%}
.hero.zoomable{cursor:zoom-in}
.zhint{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px;pointer-events:none}
.zoomv{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
.zoomv .zbar{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;color:#fff;font-size:13px}
.zoomv .zbar button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:999px;padding:8px 16px;font:inherit;font-weight:700}
.zoomv .zbox{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom;display:flex;align-items:center;justify-content:center}
.zoomv .zbox img{width:100%;height:auto;max-width:none;display:block;transition:width .15s}
.zoomv.big .zbox{align-items:flex-start;justify-content:flex-start}
.zoomv.big .zbox img{width:250%}
.note{font-size:12px;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.opt[aria-pressed="true"]{border-color:var(--brand)}
.opt .t{font-weight:700;font-size:14px}
.opt .s{font-size:12px;color:var(--muted)}
.opt .p{font-family:var(--f-num);font-weight:800;color:var(--price);font-size:16px}
.opt[disabled]{opacity:.5;cursor:not-allowed}
.stock{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.stock::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--leaf)}
.stock.out::before{background:#9b8f8f}
.vbadge{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.72);color:#fff;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px}
.pvid{display:flex;flex-direction:column;gap:8px}
.pvid .vplayer{max-width:300px}
.vrow{grid-auto-columns:minmax(118px,34%)}
.vcard{-webkit-appearance:none;appearance:none;font:inherit;color:inherit;width:100%;align-self:start;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;cursor:pointer;color:inherit;scroll-snap-align:start}
.vthumb{position:relative;display:block;width:100%;height:0;padding-top:177.78%;border-radius:14px;overflow:hidden;background:#2a1517}
.vthumb>img,.vthumb>.vph{position:absolute;inset:0;width:100%;height:100%}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vph{display:grid;place-items:center;height:100%;color:#fff;font-weight:900;font-size:28px;background:linear-gradient(160deg,#e52535,#7a0f1a)}
.vplay{position:absolute;inset:0;margin:auto;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center}
.vplay svg{width:20px;height:20px}
.vviews{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;padding:2px 7px;border-radius:999px}
.vtitle{font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vplayer{width:100%;max-width:340px;margin:0 auto;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:#000}
.vplayer iframe{width:100%;height:100%;border:0;display:block}
.clip{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:12px}
.clip .play{flex:none;width:52px;height:52px;border-radius:12px;background:#111;color:#fff;display:grid;place-items:center}
.clip .play svg{width:22px;height:22px}
.qty{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.qty button{border:0;background:none;width:40px;height:40px;font-size:20px;font-weight:700}
.qty span{min-width:34px;text-align:center;font-family:var(--f-num);font-weight:700}
.cta{border:0;border-radius:14px;background:var(--brand);color:#fff;font-weight:800;font-size:16px;height:52px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;flex:1}
.cta.wa{background:#1f8f4e}
.cta.ghost{background:var(--surface);color:var(--fg);border:1.5px solid var(--line)}
.buyrow{display:flex;gap:10px;align-items:center}

/* cart */
.line{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:14px;padding:10px;border:1px solid var(--line)}
.line .mini{width:56px;height:56px;border-radius:10px;overflow:hidden;flex:none;background:var(--chip)}
.line .mini svg{width:100%;height:100%}
.line .info{flex:1;min-width:0}
.line .info b{display:block;font-size:14px;line-height:1.3}
.line .info span{font-size:12px;color:var(--muted)}
.line .amt{font-family:var(--f-num);font-weight:700;white-space:nowrap}
.fieldset{display:flex;flex-direction:column;gap:8px}
.radio{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.radio input{accent-color:var(--brand);width:18px;height:18px}
.radio small{display:block;color:var(--muted);font-size:12px}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:18px}
.radio.off{opacity:.55}.radio.off small{color:#b3122a;font-weight:600}
.sumbox{background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}.sumbox .total{font-size:16px}.sumbox .total.grand{font-size:19px;border-top:1px dashed var(--line);padding-top:8px}.shipnote{font-size:14px;font-weight:600;color:var(--muted)}
.total .num{color:var(--price)}
textarea.msg{width:100%;min-height:150px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:13px/1.5 var(--f-text);padding:10px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--muted);position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--brand);font-weight:700}
:root[data-theme="dark"] nav.tabs button[aria-current="page"]{color:var(--price)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[aria-current="page"]{color:var(--price)}}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--brand);color:#fff;font:700 11px/18px var(--f-num);padding:0 5px}

.contact{display:flex;flex-direction:column;gap:10px}
.ccard{background:var(--surface);border-radius:14px;padding:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.ccard b{font-size:14px}
.ccard span{color:var(--muted);font-size:13.5px}
.payqr{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.payqr img{width:min(260px,100%);height:auto;border-radius:10px}
.payqr .cta{width:100%}
.ocode{display:inline-block;background:#fff3cd;color:#7a4b00;font-weight:800;padding:1px 8px;border-radius:6px;letter-spacing:.5px}
.scambar{display:flex;align-items:center;gap:10px;width:100%;margin:12px 0 4px;padding:10px 12px;border:1px solid #f3c2c6;border-radius:12px;background:#fff4f4;color:#7a1c24;font:inherit;font-size:13.5px;text-align:left;cursor:pointer}
.scambar b{color:#b3122a}.scambar .go{margin-left:auto;font-size:20px;color:#b3122a}
.scamw{text-align:center;align-items:stretch}
.scamhead{display:flex;flex-direction:column;align-items:center;gap:4px}.scamhead span{font-size:44px;line-height:1}.scamhead h2{margin:0;font-size:22px;color:#b3122a}
.scamw>p{margin:0;font-size:16px}
.scamname{background:#fff4f4;border:2px dashed #e52535;border-radius:14px;padding:14px 10px;font-size:20px;font-weight:700;color:#b3122a}
.scamlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;text-align:left;font-size:15px}
.scamlist li{background:var(--surface);border-radius:10px;padding:9px 12px}
.safe{background:#fff4f4;border:1px solid #f3c2c6;border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:#7a1c24}
.safe b{color:#b3122a}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
.inp{font:inherit;font-size:16px;color:var(--ink,#222);background:var(--surface,#fff);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
.inp:focus{outline:2px solid #e52535;outline-offset:1px}
.paystep{margin:0;align-self:stretch;text-align:left;font-size:14.5px}
.ccard a.num{color:#e52535;font-size:15px;font-weight:600;text-decoration:none;padding:2px 0}
@media (prefers-reduced-motion: no-preference){.sheet .panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px)}to{transform:none}}}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.row{grid-auto-columns:minmax(150px,31%)}}

</style>
</head>

<nav class="tabs" aria-label="ເມນູຫຼັກ"><div class="in">
  <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>ໜ້າຫຼັກ</button>
  <button data-tab="all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>ສິນຄ້າທັງໝົດ</button>
